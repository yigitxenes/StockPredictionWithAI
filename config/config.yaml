data:
  start_date: "2020-01-01"
  end_date: "2026-08-01"    
  interval: "1d"               
  tickers:
    - "GOOGL"
    - "NVDA"
    - "INTC"
    - "ORCL"
    - "JPM"
    - "TSLA"
    - "OXY"
    - "GILD"
    - "HD"
    - "AXP"
    - "AVGO"

  company_names:
    GOOGL: "Google"
    NVDA: "NVIDIA"
    INTC: "Intel"
    ORCL: "Oracle"
    JPM: "JPMorgan"
    TSLA: "Tesla"
    OXY: "Occidental Petroleum"
    GILD: "Gilead Sciences"
    HD: "Home Depot"
    AXP: "American Express"
    AVGO: "Broadcom"
  
  raw_data_path: "data/raw"
  processed_data_path: "data/processed"

  sentiment_backtest_tickers:
    - "GOOGL"
    - "NVDA"
    - "INTC"
    - "ORCL"
    - "JPM"
    - "OXY"
    - "GILD"
    - "HD"
    - "AXP"
    - "AVGO"
  sentiment_backtest_start: "2018-10-25"
  sentiment_backtest_end: "2020-06-08"

indicators:
  rsi:
    length: 14
  macd:
    fast: 12
    slow: 26
    signal: 9
  bollinger:
    length: 20
    std: 2
  atr:
    length: 14
  adx:
    length: 14
  obv: {}
  

targets:
  direction:
    horizon_days: 1          
  volatility:
    horizon_days: 5           
    method: "rolling_std"    

agent:
  provider: "gemini"       
  prototype_model: "gemini-3.5-flash-lite"
  target_local_model: "llama3.1"
  news_provider: "finnhub"
  news_lookback_days: 1
  sentiment_schema:
    fields: ["score", "confidence", "reasoning"]
  prompt_constraint: >
    Sadece verilen tarihe kadarki haber metnini kullan.
    Bu haberden sonra piyasada ne olduğunu bilmiyormuş gibi davran,
    sonuç hakkında hiçbir çıkarım yapma.

modeling:
  models: ["xgboost", "lightgbm"]
  validation:
    method: "walk_forward"     
    n_splits: 5
    expanding: true             # if false rolling window
  hyperparameter_search:
    enabled: true
    n_trials: 30

leakage_checks:
  timezone_validation: true
  prospective_test_enabled: true
  prospective_test_min_days: 14   
